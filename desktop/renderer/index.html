<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <title>Prometheus</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5c3.2 2.4 4.9 5.6 4.9 9.2 0 2.2-.7 4.1-1.9 5.6l-3-1.6-3 1.6a8.6 8.6 0 0 1-1.9-5.6c0-3.6 1.7-6.8 4.9-9.2Z" />
            <path d="M12 9.4c1.1 1 1.7 2.2 1.7 3.7 0 1-.3 1.8-.8 2.5l-.9-.5-.9.5a4.5 4.5 0 0 1-.8-2.5c0-1.5.6-2.7 1.7-3.7Z" opacity=".55" />
          </svg>
          <span class="wordmark">Prometheus</span>
        </div>

        <button class="workspace" id="workspace-button" title="Change workspace folder">
          <span class="workspace-label">Workspace</span>
          <span class="workspace-path" id="workspace-path">…</span>
        </button>

        <div class="titlebar-spacer"></div>

        <div class="titlebar-status">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">starting</span>
        </div>

        <button class="icon-button" id="sessions-button" title="Sessions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
        </button>
      </header>

      <main class="transcript" id="transcript" aria-live="polite">
        <section class="empty-state" id="empty-state">
          <h1>What should we build?</h1>
          <p>Prometheus reads, edits, and runs your code. It asks before changing files unless you switch the mode.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Summarize this project and list the main entry points.">
              Summarize this project
            </button>
            <button class="suggestion" data-prompt="Find failing tests and fix them. Verify with the project's test command.">
              Fix the failing tests
            </button>
            <button class="suggestion" data-prompt="Create a PROMETHEUS.md describing how this project is built, tested, and organized.">
              Document the repo
            </button>
          </div>
        </section>
      </main>

      <section class="composer-region" id="composer-region">
        <div class="pending-permission" id="pending-permission" hidden>
          <div class="pending-question" id="pending-question"></div>
          <div class="pending-actions">
            <button class="btn btn-primary" data-permission="yes">Allow</button>
            <button class="btn" data-permission="always">Always allow</button>
            <button class="btn btn-quiet" data-permission="no">Deny</button>
          </div>
        </div>

        <div class="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Ask Prometheus to change, explain, or build something…"
            spellcheck="false"
          ></textarea>
          <div class="composer-actions">
            <button class="stop-button" id="stop-button" hidden title="Stop (Esc)">Stop</button>
            <button class="send-button" id="send-button" title="Send (Enter)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6" /></svg>
            </button>
          </div>
        </div>

        <footer class="composer-footer">
          <div class="controls">
            <div class="segmented" id="mode-control" role="radiogroup" aria-label="Permission mode">
              <button role="radio" data-mode="ask" class="active">Ask</button>
              <button role="radio" data-mode="auto">Auto</button>
              <button role="radio" data-mode="plan">Plan</button>
            </div>
            <div class="segmented model-control" id="model-control" role="radiogroup" aria-label="Model"></div>
          </div>
          <div class="meter">
            <span id="context-label">0%</span>
            <div class="meter-track"><div class="meter-fill" id="context-fill"></div></div>
            <span class="meter-sep"></span>
            <span id="usage-label">0 tok</span>
          </div>
        </footer>
      </section>
    </div>

    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-head">
        <h2>Sessions</h2>
        <button class="icon-button" id="drawer-close" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <button class="btn btn-block" id="new-session">New session</button>
      <div class="session-list" id="session-list"></div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
